<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueda Nocturna · Medellín en Bici</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8 font-sans">
  <main class="w-full max-w-4xl mx-auto my-auto">
    <section class="w-full bg-slate-900/90 rounded-3xl border border-slate-800 p-8 md:p-12 shadow-2xl text-center space-y-8">
      <header class="w-full max-w-2xl mx-auto space-y-4">
        <p class="inline-block px-4 py-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full text-xs md:text-sm font-semibold tracking-wider uppercase">
          Nuevo · Jueves a sábado
        </p>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-black text-white tracking-tight leading-tight">
          Rueda Nocturna
        </h1>
        <p class="text-lg md:text-xl text-slate-300 font-normal leading-relaxed max-w-xl mx-auto">
          Descubre Medellín en bici cuando se encienden las luces
        </p>
      </header>

      <ul class="w-full max-w-lg mx-auto grid grid-cols-1 sm:grid-cols-2 gap-4 p-0 list-none m-0">
        <li class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 text-center space-y-1">
          <strong class="block text-3xl md:text-4xl font-extrabold text-emerald-400 tracking-tight leading-none">
            3 rutas
          </strong>
          <small class="block text-xs uppercase tracking-wider text-slate-400 font-medium">
            Recorridos nocturnos
          </small>
        </li>
        <li class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 text-center space-y-1">
          <strong class="block text-3xl md:text-4xl font-extrabold text-emerald-400 tracking-tight leading-none">
            Desde $55.000
          </strong>
          <small class="block text-xs uppercase tracking-wider text-slate-400 font-medium">
            Tarifa por persona
          </small>
        </li>
      </ul>

      <footer class="w-full flex justify-center pt-2">
        <a href="#inscribete" class="inline-block w-full sm:w-auto px-8 py-4 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-bold text-base md:text-lg rounded-xl tracking-wide uppercase transition-colors shadow-lg shadow-emerald-500/20 text-center">
          Inscríbete
        </a>
      </footer>
    </section>
  </main>
</body>
</html>
